# Written by deploy/push.sh once the wildcard certificate (__CERT__ + *.__CERT__, DNS-01 via Route 53) exists.
# Express routes by Host (marketing, app., admin., connect., <school>.anekio.com), so one block serves them all.
# JSON access log for Grafana / deploy/logs.sh (path without query string, so no tokens).
log_format anekio_json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","host":"$host","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time","ua":"$http_user_agent"}';

server {
  listen 80 default_server;
  server_name __DOMAIN__ __EXTRA_DOMAINS__;
  access_log /var/log/nginx/anekio-access.log anekio_json;
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2 default_server;
  server_name __DOMAIN__ __EXTRA_DOMAINS__;

  ssl_certificate /etc/letsencrypt/live/__CERT__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__CERT__/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  add_header Strict-Transport-Security "max-age=63072000" always;

  access_log /var/log/nginx/anekio-access.log anekio_json;
  client_max_body_size 25m;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
