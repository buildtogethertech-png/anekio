# Written by deploy/push.sh. __DOMAIN__ / __EXTRA_DOMAINS__ are replaced on deploy. Certbot adds the 443 block.
# Express routes by Host (marketing, app., admin., connect., <school>.anekio.com), so one block serves them all.
# JSON access log for Grafana / deploy/logs.sh (path without query string, so no tokens).
log_format anekio_json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","host":"$host","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time","ua":"$http_user_agent"}';

server {
  listen 80 default_server;
  server_name __DOMAIN__ __EXTRA_DOMAINS__;

  access_log /var/log/nginx/anekio-access.log anekio_json;
  client_max_body_size 25m;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;   # imports, bulk PDFs: longer than Vercel's 60 s
    proxy_send_timeout 300s;
  }
}
