# Written by deploy/push.sh for each REDIRECT_DOMAINS entry: __FROM__ → __TO__ (301).
# HTTP: any subdomain keeps its prefix (app.__FROM__ → app.__TO__). HTTPS (#SSL lines, enabled once the
# certificate exists): __FROM__ and www.__FROM__ → __TO__.
server {
  listen 80;
  server_name __FROM__ *.__FROM__;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / {
    set $sub "";
    if ($host ~* "^(?!www\.)(.+\.)__FROM_RE__$") { set $sub $1; }
    return 301 https://${sub}__TO__$request_uri;
  }
}
